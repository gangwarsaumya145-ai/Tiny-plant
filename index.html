<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Plant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Tiny Plant🪴</h1>
        <p class="subtitle">Take care of your tiny plant!</p>
        <div class="plant-cards">
            <div id="plant">
                🌱
            </div>
            <p id="status">Your plant is growing...</p>
            <div class="buttons">
                <button id="waterButton"> 💧 Water</button>
                <button id="sunButton"> ☀️ give Sunlight</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
